name: Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
        - "*.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
        - "*.md"

permissions:
  contents: write

jobs:
  AppimageBuild:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Dependencies
      run: |
        sudo add-apt-repository universe
        sudo apt install libfuse2t64
        sudo apt-get -y install libsdl2-dev libyaml-cpp-dev
    - name: Appimage
      run: make appimage
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: Appimage
        path: build/CemuShake-x86_64.AppImage

  WindowsBuild:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          zip
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-yaml-cpp

    - name: Build
      run: make windist

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: Windows
        path: build/CemuShake-x86_64-windows.zip

  Release:
    runs-on: ubuntu-24.04
    needs: [AppimageBuild, WindowsBuild]

    steps:
    - uses: actions/checkout@v4

    - name: Download Linux Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: Appimage

    - name: Download Windows Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: Windows

    - name: Set up Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Delete existing local tag if exists
      run: |
        git tag -d latest || true

    - name: Delete remote tag if exists
      run: |
        git push --delete origin latest || true

    - name: Delete old GitHub release if exists
      run: |
        gh release delete latest --yes || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create new tag
      run: |
        git tag latest
        git push origin latest --force

    - name: Create or update GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: latest
        files: |
          CemuShake-x86_64.AppImage
          CemuShake-x86_64-windows.zip
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
